[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratchet"
version = "0.1.0"
description = "Agentic code-solving framework using Claude SDK"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.69",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/ratchet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
